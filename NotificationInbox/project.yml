# Works with a free Apple ID: local notifications, in-app voice, and Siri shortcuts.
# For real remote pushes that speak themselves, use project-push.yml (paid account).
name: NotificationInbox
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NotificationInbox:
    type: application
    platform: iOS
    sources: [NotificationInbox, Shared]
    info:
      path: NotificationInbox/Info.plist
      properties:
        CFBundleDisplayName: Notification Inbox
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NotificationInbox
        TARGETED_DEVICE_FAMILY: "1,2"
